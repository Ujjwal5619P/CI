name: Building Blocks

on:
  workflow_dispatch:

jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: say hello
              run: echo "Hello, World!"
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: Failed step
              run: |
                echo "This step will fail"
                exit 0
            - name: say goodbye
              run: echo "Goodbye, World!"