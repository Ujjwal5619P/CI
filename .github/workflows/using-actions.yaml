name: Using Actions

on: push

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Setup node
              uses: actions/setup-node@v7event
              with:
                  node-version: '24.x'
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm run test

            